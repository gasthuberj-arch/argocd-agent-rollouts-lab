apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: service-a
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - name: rollouts-demo
        image: argoproj/rollouts-demo:yellow
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
  strategy:
    canary:
      canaryService: service-a-canary
      stableService: service-a-active
      steps:
      - setWeight: 30
      - pause: {} # Manual approval gate
      - setWeight: 60
      - pause: { duration: 5s }
      - analysis:
          templates:
          - templateName: service-a-check
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: service-a-active
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: service-a
---
apiVersion: v1
kind: Service
metadata:
  name: service-a-canary
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: service-a
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: service-a-check
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  metrics:
  - name: color-check
    interval: 2s
    count: 3
    failureLimit: 1
    consecutiveErrorLimit: 1
    successCondition: result != "red"
    provider:
      web:
        url: "http://service-a-canary.demo.svc.cluster.local:8080/color"
        timeoutSeconds: 2
